<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Erwin ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: white; background: radial-gradient(circle at 50% 35%, #ff7898 0, #d92d62 38%, #650d35 100%);
    }
    .glow {
      position: fixed; width: 70vmin; height: 70vmin; border-radius: 50%;
      background: #ffb0c5; filter: blur(90px); opacity: .22; animation: pulse 3s infinite alternate;
    }
    .content { position: relative; z-index: 2; text-align: center; padding: 24px; }
    #reveal { border: 1px solid #ffffff88; border-radius: 999px; padding: 16px 30px;
      color: white; background: #ffffff20; font-size: 1.05rem; cursor: pointer;
      backdrop-filter: blur(8px); transition: transform .2s, background .2s; }
    #reveal:hover { transform: scale(1.06); background: #ffffff35; }
    #message { display: none; animation: appear 1s ease both; }
    .heart {
      font-size: clamp(130px, 35vw, 300px); line-height: 1;
      color: #ff174f; text-shadow: 0 0 20px #fff, 0 0 55px #ffcada, 0 0 100px #ff174f;
      animation: heartbeat 1.1s infinite;
    }
    h1 { margin: 12px 0 0; font-size: clamp(2.2rem, 8vw, 5rem); letter-spacing: .02em;
      text-shadow: 0 4px 24px #690b31aa; }
    p { margin-top: 12px; font-size: clamp(1rem, 3vw, 1.35rem); color: #ffe5ed; }
    .sparkle { position: fixed; bottom: -30px; font-size: 22px; opacity: .8;
      animation: floatUp linear infinite; pointer-events: none; }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }
    @keyframes appear { from { opacity: 0; transform: scale(.65); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { to { transform: scale(1.2); opacity: .35; } }
    @keyframes floatUp { to { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="content">
    <button id="reveal" onclick="showLove()">Klik di sini ❤️</button>
    <section id="message" aria-live="polite">
      <div class="heart">♥</div>
      <h1>Love You Erwin</h1>
      <p>Sending you a whole lot of love ❤️</p>
    </section>
  </main>
  <script>
    function showLove() {
      document.getElementById('reveal').style.display = 'none';
      document.getElementById('message').style.display = 'block';
      for (let i = 0; i < 28; i++) {
        const s = document.createElement('span');
        s.className = 'sparkle';
        s.textContent = ['♥','❤','💕','✨'][Math.floor(Math.random()*4)];
        s.style.left = Math.random()*100 + 'vw';
        s.style.animationDuration = (4 + Math.random()*5) + 's';
        s.style.animationDelay = (Math.random()*2) + 's';
        document.body.appendChild(s);
      }
    }
  </script>
</body>
</html>
